name: 功能建议
description: 提议与项目方向一致的功能或工程改进
title: "[Feature] "
labels: []
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue 和重构路线
          required: true
        - label: 建议不依赖未获授权的医学数据或模型
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与使用场景
      description: 说明要解决的问题，而不只是期望的实现方式
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述接口、数据流或用户体验方面的方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
      description: 说明如何判断实现有效，并区分工程测试与医学质量验证
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已考虑的其他方式和主要权衡
