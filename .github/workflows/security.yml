name: security

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".secrets.baseline"
      - ".trivyignore.yaml"
      - "app/frontend/package.json"
      - "app/frontend/package-lock.json"
      - "app/frontend/scripts/audit-dependencies.mjs"
      - "docker/**"
      - "requirements.txt"
      - "tests/ragas/requirements-ragas.txt"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".secrets.baseline"
      - ".trivyignore.yaml"
      - "app/frontend/package.json"
      - "app/frontend/package-lock.json"
      - "app/frontend/scripts/audit-dependencies.mjs"
      - "docker/**"
      - "requirements.txt"
      - "tests/ragas/requirements-ragas.txt"

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Audit isolated Ragas evaluation dependencies
        run: >-
          python -m pip_audit
          -r tests/ragas/requirements-ragas.txt
          --progress-spinner off
          --ignore-vuln PYSEC-2026-3046
          --ignore-vuln PYSEC-2026-2447

  frontend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run security:audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install detect-secrets==1.5.0
      - run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  container-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - mysql:8.0.45
          - neo4j:5.26.28
          - milvusdb/milvus:v2.6.13
          - quay.io/coreos/etcd:v3.5.25
          - minio/minio:RELEASE.2024-12-18T13-15-44Z
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignores: .trivyignore.yaml
