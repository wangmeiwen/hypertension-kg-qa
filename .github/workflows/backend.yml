name: backend

on:
  push:
    paths:
      - "app/**/*.py"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "app/**/*.py"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/backend.yml"

jobs:
  fast-coverage:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hypertension_kg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: hypertension_kg
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: secret
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check Black formatting
        run: python -m black --check app tests
      - name: Run Ruff checks
        run: python -m ruff check app tests
      - name: Run mypy checks
        run: python -m mypy app
      - name: Initialize MySQL schema
        run: python -c "import asyncio; from app.backend.repositories.database import initialize_database; assert asyncio.run(initialize_database(force=True))"
      - name: Run fast tests with coverage
        run: python -m coverage run -m pytest -q -m "not db"
      - name: Report coverage
        run: python -m coverage report

  real-db:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hypertension_kg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      neo4j:
        image: neo4j:5.26.28
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd="wget -q --spider http://127.0.0.1:7474 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: hypertension_kg
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19531"
      MILVUS_DATABASE_NAME: default
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Initialize MySQL schema
        run: python -c "import asyncio; from app.backend.repositories.database import initialize_database; assert asyncio.run(initialize_database(force=True))"
      - name: Start Milvus standalone
        run: |
          docker compose -f docker/milvus/docker-compose.milvus2.yml up -d
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9092/healthz >/dev/null; then
              exit 0
            fi
            docker ps --filter name=milvus2-standalone --filter status=running --quiet | grep -q . || {
              docker compose -f docker/milvus/docker-compose.milvus2.yml logs
              exit 1
            }
            sleep 2
          done
          docker compose -f docker/milvus/docker-compose.milvus2.yml logs
          exit 1
      - name: Run real database tests
        run: python -m pytest -q -m db
      - name: Stop Milvus standalone
        if: always()
        run: docker compose -f docker/milvus/docker-compose.milvus2.yml down
